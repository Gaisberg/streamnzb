name: build-release

on:
  release:
    types: [published]
  push:
    branches-ignore:
      - 'release-please--branches--main'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the build (e.g., v1.0.0)'
        required: false
        default: 'manual-build'

permissions:
  contents: write
  packages: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase repo name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
          cd ..
          mkdir -p pkg/server/web/static
          cp -r frontend/dist/* pkg/server/web/static/

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          else
            TAG="${{ github.event.inputs.tag_name }}"
            if [ -n "$TAG" ] && [ "$TAG" != "manual-build" ]; then
              echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT
            else
              SHORT_SHA="${GITHUB_SHA:0:7}"
              RELEASE_VERSION=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' .release-please-manifest.json | head -1 || echo "0.0.0")
              echo "VERSION=${RELEASE_VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Build binaries
        run: |
          mkdir -p dist/linux_amd64 dist/linux_arm64 dist/windows_amd64 dist/darwin_amd64 dist/darwin_arm64
          LDFLAGS="-s -w -X main.TMDBKey=${{ secrets.TMDB_API_KEY }} -X main.TVDBKey=${{ secrets.TVDB_API_KEY }} -X main.Version=${{ steps.version.outputs.VERSION }}"
          # Build for Linux AMD64 (for Docker and Release)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/linux_amd64/streamnzb ./cmd/streamnzb
          # Build for Linux ARM64 (for Docker and Release)
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/linux_arm64/streamnzb ./cmd/streamnzb
          # Build for Windows AMD64 (Release only)
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/windows_amd64/streamnzb.exe ./cmd/streamnzb
          # Build for macOS AMD64 (Release only)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/darwin_amd64/streamnzb ./cmd/streamnzb
          # Build for macOS ARM64 (Release only)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/darwin_arm64/streamnzb ./cmd/streamnzb

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ env.REPO }}
            ${{ env.REPO }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=raw,value=${{ github.event.inputs.tag_name || 'latest' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare Release Assets
        if: github.event_name == 'release'
        run: |
          mkdir -p release_assets
          cp dist/linux_amd64/streamnzb release_assets/streamnzb-linux-amd64
          cp dist/linux_arm64/streamnzb release_assets/streamnzb-linux-arm64
          cp dist/windows_amd64/streamnzb.exe release_assets/streamnzb-windows-amd64.exe
          cp dist/darwin_amd64/streamnzb release_assets/streamnzb-darwin-amd64
          cp dist/darwin_arm64/streamnzb release_assets/streamnzb-darwin-arm64

      - name: Upload Release Assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} release_assets/*

      - name: GitHub Releases to Discord
        if: github.event_name == 'release'
        uses: SethCohen/github-releases-to-discord@v1.20.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          release_name: ${{ github.event.release.name }}
          release_body: ${{ github.event.release.body }}
          release_html_url: ${{ github.event.release.html_url }}
          color: "2105893"
          username: "Release Changelog"
          avatar_url: "https://cdn.discordapp.com/icons/1470288400157380710/6f397b4a2e9561dc7ad43526588cfd67.png"
          content: "||@everyone||"
          footer_title: "Changelog"
          reduce_headings: true
