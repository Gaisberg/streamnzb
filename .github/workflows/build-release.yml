name: build-release

on:
  release:
    types: [published]
  push:
    branches-ignore:
      - 'release-please--branches--main'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the build (e.g., v1.0.0)'
        required: false
        default: 'manual-build'

permissions:
  contents: write
  packages: write

jobs:
  # Nothing is published for a tree that does not pass the same checks build.sh
  # runs locally. Reused from ci.yml rather than repeated here so the release
  # gate and the pull-request check can never drift apart.
  verify:
    uses: ./.github/workflows/ci.yml

  build-release:
    needs: verify
    # Skip the release-please merge commit on push: the same code is rebuilt
    # seconds later by the tag's `release: published` event.
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(main): release')
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase repo name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      # setup-go's built-in cache is keyed only on go.sum, so the build cache
      # freezes at the last dependency change and goes stale as commits land.
      # Key on the commit SHA instead: every run saves an incremental cache and
      # the next run restores the newest one via restore-keys.
      - name: Cache Go build and module cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ hashFiles('go.sum') }}-
            go-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          mkdir -p pkg/server/web/static
          cp -r frontend/dist/* pkg/server/web/static/

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          else
            TAG="${{ github.event.inputs.tag_name }}"
            if [ -n "$TAG" ] && [ "$TAG" != "manual-build" ]; then
              echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT
            else
              SHORT_SHA="${GITHUB_SHA:0:7}"
              RELEASE_VERSION=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' .release-please-manifest.json | head -1 || echo "0.0.0")
              echo "VERSION=${RELEASE_VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT
            fi
          fi

      # The ffprobe version is pinned in installer.go, so the downloaded
      # binaries only change when that file does.
      - name: Cache embedded ffprobe binaries
        id: ffprobe-cache
        uses: actions/cache@v6
        with:
          path: pkg/media/ffprobe/bin
          key: ffprobe-${{ hashFiles('pkg/media/ffprobe/installer.go') }}

      - name: Fetch embedded ffprobe binaries
        if: steps.ffprobe-cache.outputs.cache-hit != 'true'
        run: go run ./tools/fetch-ffprobe

      - name: Build binaries
        run: |
          mkdir -p dist/linux_amd64 dist/linux_arm64 dist/windows_amd64 dist/darwin_amd64 dist/darwin_arm64
          LDFLAGS="-s -w -X main.TMDBKey=${{ secrets.TMDB_API_KEY }} -X main.TVDBKey=${{ secrets.TVDB_API_KEY }} -X main.Version=${{ steps.version.outputs.VERSION }}"
          # -tags embedffprobe bundles the matching ffprobe binary (fetched above) into each build.
          pids=()
          build() {
            CGO_ENABLED=0 GOOS="$1" GOARCH="$2" go build -tags embedffprobe -ldflags="$LDFLAGS" -o "$3" ./cmd/streamnzb &
            pids+=($!)
          }
          build linux amd64 dist/linux_amd64/streamnzb
          build linux arm64 dist/linux_arm64/streamnzb
          build windows amd64 dist/windows_amd64/streamnzb.exe
          build darwin amd64 dist/darwin_amd64/streamnzb
          build darwin arm64 dist/darwin_arm64/streamnzb
          fail=0
          for pid in "${pids[@]}"; do wait "$pid" || fail=1; done
          exit $fail

      # Releases also refresh the `main` tag: the release-please merge commit
      # no longer gets its own push build.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ env.REPO }}
            ${{ env.REPO }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=raw,value=${{ github.event.inputs.tag_name || 'latest' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' || github.event_name == 'release' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare Release Assets
        if: github.event_name == 'release'
        run: |
          mkdir -p release_assets
          cp dist/linux_amd64/streamnzb release_assets/streamnzb-linux-amd64
          cp dist/linux_arm64/streamnzb release_assets/streamnzb-linux-arm64
          cp dist/windows_amd64/streamnzb.exe release_assets/streamnzb-windows-amd64.exe
          cp dist/darwin_amd64/streamnzb release_assets/streamnzb-darwin-amd64
          cp dist/darwin_arm64/streamnzb release_assets/streamnzb-darwin-arm64

      - name: Upload Release Assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} release_assets/*

      - name: GitHub Releases to Discord
        if: github.event_name == 'release'
        uses: SethCohen/github-releases-to-discord@v1.20.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          release_name: ${{ github.event.release.name }}
          release_body: ${{ github.event.release.body }}
          release_html_url: ${{ github.event.release.html_url }}
          color: "2105893"
          username: "Release Changelog"
          avatar_url: "https://cdn.discordapp.com/icons/1470288400157380710/6f397b4a2e9561dc7ad43526588cfd67.png"
          content: "||@everyone||"
          footer_title: "Changelog"
          reduce_headings: true
