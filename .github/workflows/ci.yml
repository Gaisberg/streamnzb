name: ci

# The same checks build.sh runs locally, so a red tree is caught before
# build-release publishes anything. Pull requests run this directly; pushes
# reach it through build-release, which calls this workflow and gates on it.
# Keeping it callable rather than duplicating the steps means the gate and the
# PR check can never drift apart.
on:
  pull_request:
    # release-please's "chore(main): release X" pull request changes these two
    # files and nothing else, so there is no code in it to check — it is the
    # code already on main, which CI passed on the way in. Skipping is worth ~3
    # minutes and two red-looking checks on every release.
    #
    # A path filter rather than a branch or title match, because it is
    # self-limiting: `paths-ignore` only skips when *every* changed file matches,
    # so the day one of these pull requests carries a code change, CI runs.
    #
    # Only under pull_request. workflow_call takes no path filters, and
    # build-release calls this workflow for the release build itself, which must
    # always run.
    paths-ignore:
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      # Same cache strategy as build-release: setup-go's built-in cache is keyed
      # only on go.sum and goes stale as commits land, so key on the commit SHA
      # and restore the newest prefix match.
      - name: Cache Go build and module cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ hashFiles('go.sum') }}-
            go-

      # build.sh runs `go fmt`, which rewrites files; CI only reports.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l ./pkg ./cmd)"
          if [ -n "${unformatted}" ]; then
            echo "These files are not gofmt-clean:"
            echo "${unformatted}"
            exit 1
          fi

      # pkg/server/web embeds pkg/server/web/static, which is gitignored: it is
      # produced by the frontend build. On a fresh checkout the directory does
      # not exist, so `//go:embed all:static` is a compile error and every Go
      # command below fails before it checks anything. The dev machine never saw
      # it because a previous build had always left the directory behind.
      #
      # A placeholder is enough: nothing under test reads the real assets, and
      # build-release copies them in before building the binary it ships.
      - name: Ensure the embedded asset directory exists
        run: |
          mkdir -p pkg/server/web/static
          touch pkg/server/web/static/.gitkeep

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      # The production build catches what ESLint does not: import resolution,
      # Tailwind config errors, and anything that only fails under Vite's
      # bundler. build-release builds the frontend again for the artifact; this
      # run exists to fail fast on a broken tree.
      - name: Build frontend
        run: npm run build
        working-directory: frontend

  race:
    # `-race` needs cgo, which the dev machine does not have, so this is the
    # only place it runs on every change. It was non-blocking while its first
    # results were unknown; those came back, the races it found were fixed, and
    # it is green — so it blocks now, and a data race stops a release the same
    # way a failing test does.
    #
    # To reproduce a failure from here without a cgo toolchain, run it in a
    # container. `GetDataDir()` returns /app/data whenever /.dockerenv exists,
    # which breaks the data-dir tests, so remove that marker first:
    #
    #   docker run --rm -v "$PWD:/src" -w /src golang:1.25 sh -c     #     'rm -f /.dockerenv && mkdir -p pkg/server/web/static &&     #      touch pkg/server/web/static/.gitkeep && go test -race ./...'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Cache Go build and module cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-race-${{ hashFiles('go.sum') }}-
            go-race-

      # pkg/server/web embeds pkg/server/web/static, which is gitignored: it is
      # produced by the frontend build. On a fresh checkout the directory does
      # not exist, so `//go:embed all:static` is a compile error and every Go
      # command below fails before it checks anything. The dev machine never saw
      # it because a previous build had always left the directory behind.
      #
      # A placeholder is enough: nothing under test reads the real assets, and
      # build-release copies them in before building the binary it ships.
      - name: Ensure the embedded asset directory exists
        run: |
          mkdir -p pkg/server/web/static
          touch pkg/server/web/static/.gitkeep

      - name: Test with race detector
        run: go test -race ./...
